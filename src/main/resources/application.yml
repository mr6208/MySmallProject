spring:
  h2:
    console:
      enabled: true
      path: /h2-console


  jpa:
#    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: always

  data:
    web:
      pageable:
        one-indexed-parameters: true
        default-page-size: 5
    redis:
      host: redis
      port: 6379

  datasource:
    url: jdbc:h2:mem:mr6208
    username: sa
    password:
    driver-class-name: org.h2.Driver

